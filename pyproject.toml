# Active Inference Meta-Analysis Project Configuration
# Inherits workspace settings from root pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "act_inf_metaanalysis"
version = "2.0.6"
description = "Computational literature meta-analysis of the Active Inference field using probabilistic knowledge graphs"
authors = [
    {name = "Daniel Friedman", email = "daniel@activeinference.institute"},
    {name = "Joel Dietz", email = "jdietz@mit.edu"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "requests>=2.31.0",
    "rdflib>=7.0.0",
    "pyyaml>=6.0",
    "wordcloud>=1.9.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-httpserver>=1.0.8",
]
llm = [
    "ollama>=0.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*", "*/__init__.py", "*/test_*.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[project.urls]
Homepage = "https://github.com/ActiveInferenceInstitute/act_inf_metaanalysis"
Documentation = "https://github.com/ActiveInferenceInstitute/act_inf_metaanalysis/tree/main/doc"

[tool.uv]
# Inherits workspace settings from root pyproject.toml
