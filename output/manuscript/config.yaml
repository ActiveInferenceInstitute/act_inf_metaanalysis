# Active Inference Meta-Analysis Configuration
# A Living Literature Review Architecture for Active Inference

paper:
  title: "A Living Literature Review Architecture for Active Inference: Scalable Assertion Extraction, Nanopublications, and Citation-Weighted Hypothesis Scoring"
  subtitle: "A Computational Meta-Analysis of the Active Inference Literature (2000–2026)"
  version: "1.0"
  date: "" # Auto-generated

authors:
  - name: "Daniel Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true
  - name: "Joel Dietz"
    orcid: "0000-0002-9456-2691"
    email: "joel@dietz.com"
    affiliation: "Independent Researcher"

publication:
  doi: ""
  journal: ""
  volume: ""
  pages: ""
  year: "2026"

keywords:
  - "active inference"
  - "free energy principle"
  - "energy-based models"
  - "knowledge graphs"
  - "nanopublications"
  - "meta-analysis"
  - "probabilistic modeling"
  - "literature analysis"
  - "computational psychiatry"
  - "bibliometrics"
  - "hypothesis scoring"
  - "LLM extraction"
  - "variational inference"
  - "Helmholtz machine"
  - "contrastive learning"
  - "Boltzmann machine"
  - "variational autoencoder"

metadata:
  license: "CC-BY-4.0"
  language: "en"
  repository: "https://github.com/docxology/act_inf_metaanalysis"

llm:
  reviews:
    enabled: true
    types:
      - executive_summary
  translations:
    enabled: true
    languages:
      - zh

testing:
  max_test_failures: 0
  max_infra_test_failures: 0
  max_project_test_failures: 0

# Project-specific configuration namespace.
# Keys under project_config are passed through without schema validation warnings.
# Access in scripts via: config.get('project_config', {}).get('search', {})
project_config:
  search:
    start_year: 2000  # Only include papers published 2000 onward (enforced in pipeline)
    query: '"active inference" "free energy principle" "energy-based model"'
    max_results: 1000
    resume: true
    clear_corpus: false
    arxiv_queries:
      - 'all:"active inference"'
      - 'all:"free energy principle"'
      - 'all:"predictive coding" AND all:"free energy"'
      - 'all:"expected free energy"'
      - 'all:"variational free energy" AND all:"inference"'
      - 'all:"energy-based model" AND all:"free energy"'
      - 'all:"Helmholtz machine" AND all:"inference"'
      - 'all:"Boltzmann machine" AND all:"free energy"'
      - 'all:"contrastive divergence" AND all:"generative model"'

  knowledge_graph:
    resume: true
    checkpoint_interval: 50
    checkpoint_path: "output/data/nanopublications.jsonl"
    clear_assertions: false
    max_papers: null

  llm_extraction:
    model: "gemma3:4b"
    base_url: "http://localhost:11434"
    temperature: 0.1
    max_tokens: 2048
    timeout_seconds: 120
    max_retries: 3

  hypothesis_definitions:
    H1:
      name: "FEP Universality"
      description: "The Free Energy Principle applies universally to all self-organizing systems"
      scope: "theoretical"
    H2:
      name: "AIF Optimality"
      description: "Active Inference agents achieve optimal decision-making under uncertainty"
      scope: "computational"
    H3:
      name: "Markov Blanket Realism"
      description: "Markov blankets correspond to real physical boundaries"
      scope: "philosophical"
    H4:
      name: "Predictive Coding"
      description: "Cortical hierarchies minimize prediction errors via predictive coding"
      scope: "empirical"
    H5:
      name: "Scalability"
      description: "Active Inference scales to complex, high-dimensional environments"
      scope: "computational"
    H6:
      name: "Clinical Utility"
      description: "Active Inference provides clinically useful models of psychiatric conditions"
      scope: "applied"
    H7:
      name: "Morphogenesis"
      description: "The FEP explains morphogenetic and developmental processes"
      scope: "biological"
    H8:
      name: "Language AIF"
      description: "Active Inference provides a viable framework for language processing"
      scope: "applied"

  pipeline_stages:
    - name: literature_search
      script: 01_literature_search.py
      inputs: []
      outputs:
        - output/data/corpus.jsonl
      description: "Query arXiv, Semantic Scholar, OpenAlex; merge and deduplicate"

    - name: meta_analysis
      script: 02_meta_analysis_pipeline.py
      inputs:
        - output/data/corpus.jsonl
      outputs:
        - output/data/subfield_classification.json
        - output/data/subfield_timeline.json
        - output/data/temporal_analysis.json
        - output/data/tfidf_data.json
        - output/data/topics.json
        - output/data/citation_network.json
        - output/data/citation_graph.gml
      description: "Classify subfields, compute temporal metrics, TF-IDF, NMF, citation network"

    - name: knowledge_graph
      script: 03_build_knowledge_graph.py
      inputs:
        - output/data/corpus.jsonl
      outputs:
        - output/data/nanopublications.jsonl
        - output/data/nanopublications.trig
        - output/data/hypothesis_scores.json
        - output/data/hypothesis_trends.json
        - output/data/assertion_summary.json
      description: "Extract LLM-based assertions, build KG, score hypotheses, export RDF/TriG nanopubs, compute temporal trends"

    - name: figure_generation
      script: 04_generate_figures.py
      inputs:
        - output/data/subfield_classification.json
        - output/data/subfield_timeline.json
        - output/data/temporal_analysis.json
        - output/data/tfidf_data.json
        - output/data/topics.json
        - output/data/citation_network.json
        - output/data/hypothesis_scores.json
        - output/data/hypothesis_trends.json
        - output/data/assertion_summary.json
      outputs:
        - output/figures/field_summary.png
        - output/figures/subfield_distribution.png
        - output/figures/growth_curve.png
        - output/figures/subfield_timeline.png
        - output/figures/citation_network.png
        - output/figures/degree_distribution.png
        - output/figures/hypothesis_dashboard.png
        - output/figures/evidence_timeline.png
        - output/figures/word_cloud.png
        - output/figures/pca_embeddings.png
        - output/figures/term_heatmap.png
        - output/figures/dendrogram.png
        - output/figures/topic_term_bars.png
        - output/figures/cooccurrence_matrix.png
        - output/figures/assertion_breakdown.png
        - output/figures/assertion_summary.png
      description: "Render all publication-ready visualizations from analysis JSON outputs"

    - name: inject_variables
      script: 05_inject_variables.py
      inputs:
        - output/data/corpus.jsonl
        - output/data/temporal_analysis.json
        - output/data/subfield_classification.json
        - output/data/assertion_summary.json
        - output/data/hypothesis_scores.json
        - output/data/citation_network.json
      outputs:
        - manuscript/00_abstract.md
        - manuscript/01_introduction.md
        - manuscript/02_methods_overview.md
        - manuscript/02a_methods_retrieval.md
        - manuscript/02b_methods_extraction.md
        - manuscript/02c_methods_bibliometrics.md
        - manuscript/02d_methods_knowledge_graph.md
        - manuscript/02e_methods_viz_injection.md
        - manuscript/03_results_hypothesis.md
        - manuscript/03a_results_field_overview.md
        - manuscript/03b_results_subfields.md
        - manuscript/03c_results_text_analytics.md
        - manuscript/03d_results_citation_network.md
        - manuscript/04_conclusion.md
        - manuscript/04a_discussion.md
        - manuscript/05_appendix_tooling.md
        - manuscript/06_appendix_technical.md
      description: "Compute dynamic variables from pipeline outputs and inject them into manuscript Markdown templates"

