schema_version: "2.0"
survey_date: "2026-07-26"
purpose: "Source registry for the publication-facing Active Inference tooling inventory."
verification_policy:
  stale_after_days: 365
  required_observations:
    - canonical_source_url
    - source_alive
    - release_or_version
    - license
    - activity_status
  interpretation: "A pass means every row was externally checked. Row-level flags remain visible for source-only, stale, restricted, or unlicensed entries."
inclusion_rule:
  - "Retain a tool only when a paper, preprint identifier, or official project source is recorded."
  - "Do not infer adoption, maintenance, license, or comparative performance from citation counts."
  - "Treat version, license, activity, and access status as fields requiring a dated source check."
published_source_keys:
  - pymdp
  - spm
  - rxinfer
  - activeinference_jl
  - cpp_aif
  - feps
  - deep_active_inference_mc
