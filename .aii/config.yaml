# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-12'
repo:
  name: act_inf_metaanalysis
  slug: act-inf-metaanalysis
  full_name: ActiveInferenceInstitute/act_inf_metaanalysis
  description: A reproducible computational meta-analysis snapshot of the Active Inference
    and Free Energy Principle literature. The checked-in publication snapshot covers
    1,106 retrieved papers and 2,561 extracted nanopublications across theory, tools,
    and application domains. By mapping these into a citation-weighted knowledge graph,
    this project provides a reproducible review of hypothesis-level evidence while
    preserving an explicit boundary around incomplete live-source refreshes.
institute:
  category: publication
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    relation: references
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/ActiveInferenceJournal
    relation: referenced-by
    note: Featured in Institute materials.
  links:
    github: https://github.com/ActiveInferenceInstitute/act_inf_metaanalysis
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: src
  kind: code
  description: Source tree.
- path: pyproject.toml
  kind: code
  description: Python package config.
- path: gnn
  kind: doc
  description: Illustrative GNN structural sketches for hypotheses H1, H4, and H8;
    documentation only, not evidence and not a pipeline input.
- path: act_inf_metaanalysis_v2.0.6_2026-07-26.pdf
  kind: publication
  description: Date-stamped validated PDF release artifact.
- path: output
  kind: publication-data
  description: Versioned data, figures, hydrated manuscript, reports, validation records,
    release packages, snapshots, and HTML/PDF build outputs.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: CITATION.cff
  kind: citation
  description: Machine-readable citation metadata.
- path: tests
  kind: test
  description: Test suite.
- path: manuscript
  kind: publication
  description: Manuscript sources and artifacts.
- path: docs
  kind: doc
  description: Documentation hub (README, documentation index, generated gate receipt).
- path: doc
  kind: doc
  description: Long-form guides (architecture, data formats, citation metadata, API reference, scripts, testing).
- path: CHANGELOG.md
  kind: doc
  description: Changelog.
provenance:
  license: CC-BY-4.0
  citation:
    doi: 10.5281/zenodo.19461934
    text: Active Inference Institute — act_inf_metaanalysis.
instituteos:
  tags:
  - meta-analysis
  - computational
  - active-inference
  - tex
capabilities:
- python-package
- tested
- ci
- citation
- manuscript-publication
tasks:
  lint:
    cmd: ./run.sh lint
    description: Run the repository lint arm.
  types:
    cmd: ./run.sh types
    description: Run the source type-checking arm.
  test-fast:
    cmd: ./run.sh test-fast
    description: Run tests excluding the slow figure-generation selection.
  test-full:
    cmd: ./run.sh test-full
    description: Run the full suite with the repository coverage gate.
  docs:
    cmd: ./run.sh docs
    description: Check links, docs/documentation-index.md coverage, and Publishing artifact digests.
  gnn:
    cmd: ./run.sh gnn
    description: Check illustrative sketches using the parser pinned in .github/gnn-pin.json.
  render:
    cmd: ./run.sh render
    description: Render the manuscript via uv run python scripts/15_render_publication.py --output-root .render-check.
  all:
    cmd: ./run.sh all
    description: Run the repository's blocking gate sequence.
  bench:
    cmd: ./run.sh bench
    description: Measure the gate arms and regenerate docs/_generated/gate_arms.md.
docs:
- README.md
- AGENTS.md
- .aii/docs/INTEGRATION.md
- docs/README.md
- .aii/docs/AGENTS.md
- docs/documentation-index.md
- docs/workflows/publishing.md
schema: aii-sidecar/v1
