  slug: act-inf-metaanalysis
  full_name: ActiveInferenceInstitute/act_inf_metaanalysis
  description: A reproducible computational meta-analysis snapshot of the Active
    Inference and Free Energy Principle literature. The checked-in publication
    snapshot covers 1,106 retrieved papers and 2,561 extracted nanopublications
    across theory, tools, and application domains. By mapping these into a
    citation-weighted knowledge graph, this project provides a reproducible review
    of hypothesis-level evidence while preserving an explicit boundary around
    incomplete live-source refreshes.
