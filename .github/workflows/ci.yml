name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: gate (lint, types, docs, gnn, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync one environment for every arm
        run: uv sync --extra dev

      # Every step below calls an arm of the repository's single gate entry
      # point. The arm commands live in scripts/gate.py, not in this workflow.
      - name: Lint
        run: ./run.sh lint

      - name: Type check
        run: ./run.sh types

      - name: Documentation links and index
        run: ./run.sh docs

      - name: Pinned GNN conformance
        run: ./run.sh gnn

      - name: Test + coverage gate
        run: ./run.sh test-full
